map $http_upgrade $connection_upgrade {
    default upgrade;
    '' '';
}

# 支付回调专用限流：真实网关一天几笔，30r/m 留足余量
limit_req_zone $binary_remote_addr zone=pay_webhook:10m rate=30r/m;

upstream sub2api_upstream {
    server sub2api-green:8080 max_fails=3 fail_timeout=10s;
    keepalive 128;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 256m;
    keepalive_timeout 120s;
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;

    location = /health {
        proxy_pass http://sub2api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    # 支付网关回调：真实网关只用 GET(沐云) / POST，其余方法一律拒绝；
    # 限制请求体大小与频率，降低伪造回调与扫描的可行性。
    location ^~ /api/v1/payment/webhook/ {
        limit_except GET POST {
            deny all;
        }
        client_max_body_size 8k;
        limit_req zone=pay_webhook burst=10 nodelay;

        proxy_pass http://sub2api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://sub2api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
    }
}
