name: One-time copy deployment secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copy:
    name: Copy secrets to RecurdreamImage
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GH_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
      TARGET_REPOSITORY: merak824/RecurdreamImage
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_PORT: ${{ secrets.SERVER_PORT }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      SERVER_SSH_KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
      SERVER_USER: ${{ secrets.SERVER_USER }}

    steps:
      - name: Validate source secrets
        shell: bash
        run: |
          set -Eeuo pipefail

          required=(
            GH_TOKEN
            SERVER_HOST
            SERVER_PORT
            SERVER_SSH_KEY
            SERVER_SSH_KNOWN_HOSTS
            SERVER_USER
          )

          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is missing or empty"
              exit 1
            fi
          done

      - name: Copy deployment secrets
        shell: bash
        run: |
          set -Eeuo pipefail

          names=(
            SERVER_HOST
            SERVER_PORT
            SERVER_SSH_KEY
            SERVER_SSH_KNOWN_HOSTS
            SERVER_USER
          )

          for name in "${names[@]}"; do
            printf '%s' "${!name}" | gh secret set "$name" --repo "$TARGET_REPOSITORY"
          done

      - name: Verify target secret names
        shell: bash
        run: |
          set -Eeuo pipefail

          target_names="$(gh secret list --repo "$TARGET_REPOSITORY" --json name --jq '.[].name')"
          for name in SERVER_HOST SERVER_PORT SERVER_SSH_KEY SERVER_SSH_KNOWN_HOSTS SERVER_USER; do
            if ! grep -Fxq "$name" <<<"$target_names"; then
              echo "::error::$name was not created in $TARGET_REPOSITORY"
              exit 1
            fi
          done

          echo "All deployment secret names are present in $TARGET_REPOSITORY."
