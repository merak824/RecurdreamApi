name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Check deployment scripts
        run: |
          /bin/bash -n deploy/apple-container.sh
          /bin/bash deploy/tests/apple-container-test.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-compose-gateway-env-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check Docker Compose simple mode environment
        run: /bin/sh deploy/tests/docker-compose-simple-mode-env-test.sh
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.3'
      - name: Unit tests
        id: unit
        working-directory: backend
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          make test-unit 2>&1 | tee "$RUNNER_TEMP/unit.log"
      - name: Report unit test failures
        if: steps.unit.outcome == 'failure'
        shell: bash
        run: |
          LOG="$RUNNER_TEMP/unit.log"
          {
            echo '### Unit test failure summary'
            echo '```'
            grep -E '^(FAIL|--- FAIL|# |panic:)' "$LOG" | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 单条注解上限约 4096 字符，合并输出必然被截断；按 --- FAIL 切块，一块一条注解。
          python3 - "$LOG" <<'PY' || true
          import re, sys

          text = open(sys.argv[1], errors='replace').read()
          keep = re.compile(
              r'(--- FAIL:|Error Trace:|Error:|expected:|actual|Messages:|Test:|_test\.go:\d+)'
          )
          n = 0
          for chunk in re.split(r'\n(?=\s*--- FAIL:)', text):
              if '--- FAIL:' not in chunk:
                  continue
              lines = [ln.strip() for ln in chunk.splitlines() if keep.search(ln)]
              if not lines:
                  continue
              msg = '\n'.join(lines[:12])[:3400]
              msg = msg.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              n += 1
              print('::error title=unit-fail-%02d::%s' % (n, msg))
              if n >= 15:
                  break
          PY
          exit 1
      - name: Integration tests
        id: integration
        working-directory: backend
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          make test-integration 2>&1 | tee "$RUNNER_TEMP/integration.log"
      - name: Report integration test failures
        if: steps.integration.outcome == 'failure'
        shell: bash
        run: |
          LOG="$RUNNER_TEMP/integration.log"
          {
            echo '### Integration test failure summary'
            echo '```'
            grep -E '^(FAIL|--- FAIL|# |panic:|.*test timed out)' "$LOG" | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 集成测试常见的失败形态有三种：--- FAIL 块、包级编译错误（# pkg）、
          # 以及包级 panic / 超时（此时没有 --- FAIL 行）。按这三种边界切块，
          # 每块一条注解，否则只会看到 "exit code 2" 这类无信息量的报错。
          python3 - "$LOG" <<'PY' || true
          import re, sys

          text = open(sys.argv[1], errors='replace').read()
          keep = re.compile(
              r'(--- FAIL:|Error Trace:|Error:|expected:|actual|Messages:|Test:|\.go:\d+:\d+:'
              r'|panic:|test timed out|^\s*# |^\s*FAIL\s)'
          )
          boundary = re.compile(r'\n(?=\s*(?:--- FAIL:|--- FAIL\b|panic:|\# )|.*test timed out)')
          n = 0
          for chunk in boundary.split(text):
              if not re.search(r'(--- FAIL:|panic:|test timed out|^\s*# )', chunk, re.M):
                  continue
              lines = [ln.strip() for ln in chunk.splitlines() if keep.search(ln)]
              if not lines:
                  continue
              msg = '\n'.join(lines[:14])[:3400]
              msg = msg.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              n += 1
              print('::error title=integration-fail-%02d::%s' % (n, msg))
              if n >= 10:
                  break
          PY
          exit 1

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend typecheck and critical vitest
        run: make test-frontend

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.3'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=30m
          working-directory: backend

  release-helpers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r .github/release-tools/requirements-release.txt
      - run: python -m unittest discover -s .github/release-tools -p 'test_release_matrix.py'
      - run: bash -n .github/release-tools/release-images.sh
